services:
  octo:
    build: .
    container_name: octo
    restart: unless-stopped
    ports:
      - "5274:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production

      # ----- Subsonic / Navidrome upstream -----
      # Required. Your Navidrome server, reachable from THIS container (a LAN IP
      # or service name, not localhost). Left blank on purpose so a missing value
      # is detected and reported clearly instead of silently failing.
      Subsonic__Url: ${SUBSONIC_URL:-}
      # Optional Navidrome admin login. Lets Octo detect the music folder and run
      # authenticated rescans on its own. Leave blank to have Octo learn an admin
      # token from a client sign-in instead.
      Subsonic__AdminUsername: ${SUBSONIC_ADMIN_USERNAME:-}
      Subsonic__AdminPassword: ${SUBSONIC_ADMIN_PASSWORD:-}
      # Auto-detect the download folder from Navidrome so downloads land where it
      # scans. Only adopts a path Octo can actually see; otherwise falls back to
      # Library__DownloadPath below. Set false to always use that path verbatim.
      Subsonic__AutoDetectDownloadPath: ${AUTO_DETECT_DOWNLOAD_PATH:-true}
      Subsonic__StorageMode: ${STORAGE_MODE:-Stream}
      Subsonic__DownloadMode: ${DOWNLOAD_MODE:-Track}
      Subsonic__DownloadOnStar: ${DOWNLOAD_ON_STAR:-true}
      Subsonic__DownloadAlbumOnStar: ${DOWNLOAD_ALBUM_ON_STAR:-true}
      # Name the user who starred a track on its history entry and notification.
      Subsonic__RecordRequestedBy: ${RECORD_REQUESTED_BY:-true}
      Subsonic__WaitForLosslessOnPlay: ${WAIT_FOR_LOSSLESS_ON_PLAY:-false}
      Subsonic__LosslessWaitTimeoutSeconds: ${LOSSLESS_WAIT_TIMEOUT_SECONDS:-0}
      Subsonic__FolderStructure: ${FOLDER_STRUCTURE:-Flat}
      Subsonic__DownloadSource: ${DOWNLOAD_SOURCE:-Soulseek}
      Subsonic__UseLocalStaging: ${USE_LOCAL_STAGING:-false}
      Subsonic__ExplicitFilter: ${EXPLICIT_FILTER:-All}
      Subsonic__CacheDurationHours: ${CACHE_DURATION_HOURS:-1}
      Subsonic__EnableExternalPlaylists: ${ENABLE_EXTERNAL_PLAYLISTS:-false}
      Subsonic__EnableSearchDiscovery: ${ENABLE_SEARCH_DISCOVERY:-true}
      # Clients that sync the library and search offline (Symfonium) get your radio
      # stations' tracks appended to the sync, so discovery reaches them too.
      Subsonic__EnableSyncCatalog: ${ENABLE_SYNC_CATALOG:-true}
      Subsonic__SyncCatalogClients: ${SYNC_CATALOG_CLIENTS:-Symfonium}
      Subsonic__SyncCatalogMaxSongs: ${SYNC_CATALOG_MAX_SONGS:-1000}

      # Where downloaded FLACs land (bind-mount below)
      Library__DownloadPath: /music

      # ----- Deezer account and acquisition quality -----
      Deezer__Arl: ${DEEZER_ARL:-}
      Deezer__ArlFallback: ${DEEZER_ARL_FALLBACK:-}
      Deezer__Quality: ${DEEZER_QUALITY:-FLAC}
      Deezer__CacheEnabled: ${DEEZER_CACHE_ENABLED:-false}
      Deezer__CacheQuality: ${DEEZER_CACHE_QUALITY:-FLAC}
      Deezer__MaxConcurrentDownloads: ${DEEZER_MAX_CONCURRENT_DOWNLOADS:-4}
      Deezer__MaxConcurrentBackgroundDownloads: ${DEEZER_MAX_CONCURRENT_BACKGROUND_DOWNLOADS:-2}
      Deezer__MaxConcurrentTranscodes: ${DEEZER_MAX_CONCURRENT_TRANSCODES:-4}
      Deezer__CachePath: /app/cache/deezer
      Deezer__CacheMaxGiB: ${DEEZER_CACHE_MAX_GIB:-20}
      Deezer__CacheRetentionDays: ${DEEZER_CACHE_RETENTION_DAYS:-7}

      # ----- slskd (Soulseek) sidecar -----
      Soulseek__BaseUrl: http://slskd:5030
      Soulseek__Username: ${SLSKD_USERNAME:-slskd}
      Soulseek__Password: ${SLSKD_PASSWORD:-slskd}
      Soulseek__SearchWaitSeconds: ${SLSKD_SEARCH_WAIT_SECONDS:-30}
      Soulseek__MinFileSizeBytes: ${SLSKD_MIN_FILE_SIZE_BYTES:-5242880}
      Soulseek__PreferredExtension: ${SLSKD_PREFERRED_EXTENSION:-flac}
      Soulseek__DownloadTimeoutSeconds: ${SLSKD_DOWNLOAD_TIMEOUT_SECONDS:-180}
      # Fingerprint every finished download and identify it before it joins the
      # library. A peer that sends a different recording gets that file remembered
      # and never tried again. Needs the free AcoustID key; inert without one.
      Soulseek__VerifyDownloads: ${SLSKD_VERIFY_DOWNLOADS:-false}
      Soulseek__AcoustIdApiKey: ${ACOUSTID_API_KEY:-}
      Soulseek__MinMatchScore: ${SLSKD_MIN_MATCH_SCORE:-85}
      Soulseek__TagFromMusicBrainz: ${SLSKD_TAG_FROM_MUSICBRAINZ:-false}
      # Name the file from the matched recording too (artist folder, title, album,
      # track). Off by default; only files Octo downloads and confirms are named this way.
      Soulseek__NameFromMatch: ${NAME_FROM_MATCH:-false}
      Soulseek__RejectedPeerTtlDays: ${SLSKD_REJECTED_PEER_DAYS:-30}
      Soulseek__FingerprintSeconds: ${SLSKD_FINGERPRINT_SECONDS:-120}
      Soulseek__FingerprintTimeoutSeconds: ${SLSKD_FINGERPRINT_TIMEOUT_SECONDS:-30}
      Soulseek__AcoustIdTimeoutSeconds: ${SLSKD_ACOUSTID_TIMEOUT_SECONDS:-10}
      # Send AcoustID the fingerprints you confirmed with Keep, so the next person gets a
      # confident match. Needs your personal AcoustID key (acoustid.org, after signing in).
      Soulseek__SubmitConfirmedFingerprints: ${ACOUSTID_SUBMIT:-false}
      Soulseek__AcoustIdUserApiKey: ${ACOUSTID_USER_KEY:-}

      # ----- existing Lidarr (optional heart-download source) -----
      Lidarr__BaseUrl: ${LIDARR_URL:-}
      Lidarr__ApiKey: ${LIDARR_API_KEY:-}
      Lidarr__RootFolderPath: ${LIDARR_ROOT_FOLDER_PATH:-}
      Lidarr__QualityProfileId: ${LIDARR_QUALITY_PROFILE_ID:-0}
      Lidarr__MetadataProfileId: ${LIDARR_METADATA_PROFILE_ID:-0}
      Lidarr__CompletionMode: ${LIDARR_COMPLETION_MODE:-Accepted}
      Lidarr__ImportTimeoutSeconds: ${LIDARR_IMPORT_TIMEOUT_SECONDS:-1800}

      # ----- Last.fm radio (core Octo feature; no separate Radio service) -----
      LastFm__ApiKey: ${LASTFM_API_KEY:-}
      LastFm__ApiSecret: ${LASTFM_API_SECRET:-}
      LastFm__EnableRadio: ${LASTFM_ENABLE_RADIO:-true}
      LastFm__RadioTrackCount: ${LASTFM_RADIO_TRACK_COUNT:-50}
      LastFm__RadioCacheDurationHours: ${LASTFM_RADIO_CACHE_HOURS:-24}
      LastFm__EnablePersonalizedStations: ${LASTFM_ENABLE_PERSONALIZED_STATIONS:-true}
      LastFm__EnableYourMix: ${LASTFM_ENABLE_YOUR_MIX:-true}
      LastFm__EnableDiscoveryMix: ${LASTFM_ENABLE_DISCOVERY_MIX:-true}
      LastFm__ArtistStationCount: ${LASTFM_ARTIST_STATION_COUNT:-2}
      LastFm__GenreStationCount: ${LASTFM_GENRE_STATION_COUNT:-3}
      LastFm__EnableDiscoveryStations: ${LASTFM_ENABLE_DISCOVERY_STATIONS:-true}
      LastFm__ExposeRadioAsPlaylists: ${LASTFM_EXPOSE_AS_PLAYLISTS:-true}
      LastFm__ExposeRadioAsStreams: ${LASTFM_EXPOSE_AS_STREAMS:-true}
      LastFm__RadioStreamBitrateKbps: ${LASTFM_RADIO_STREAM_BITRATE_KBPS:-192}
      LastFm__HistoryRetentionDays: ${LASTFM_HISTORY_RETENTION_DAYS:-90}
      LastFm__DiscoveryPercent: ${LASTFM_DISCOVERY_PERCENT:-35}
      LastFm__RefreshIntervalHours: ${LASTFM_REFRESH_INTERVAL_HOURS:-12}
      LastFm__MinimumPlays: ${LASTFM_MINIMUM_PLAYS:-10}

      # ----- Mixes: genre and decade playlists drawn from your own library -----
      # Served by Octo per listener, like the radio stations; nothing is written to Navidrome.
      GeneratedPlaylists__Enabled: ${MIXES_ENABLED:-false}
      GeneratedPlaylists__Genres: ${MIXES_GENRES:-true}
      GeneratedPlaylists__Decades: ${MIXES_DECADES:-true}
      GeneratedPlaylists__TrackCount: ${MIX_TRACK_COUNT:-100}
      GeneratedPlaylists__MaxPerArtist: ${MIX_MAX_PER_ARTIST:-3}
      GeneratedPlaylists__CreateAt: ${MIX_CREATE_AT:-20}
      GeneratedPlaylists__RemoveBelow: ${MIX_REMOVE_BELOW:-10}
      GeneratedPlaylists__MaxPlaylists: ${MIX_MAX_PLAYLISTS:-20}
      GeneratedPlaylists__RefreshHours: ${MIX_REFRESH_HOURS:-24}
      GeneratedPlaylists__NewShare: ${MIX_NEW_SHARE:-0}
      GeneratedPlaylists__NewDays: ${MIX_NEW_DAYS:-30}
      # Empty means "{0} Mix". A default with braces cannot be written here, because the
      # first closing brace would end the variable.
      GeneratedPlaylists__NameFormat: ${MIX_NAME_FORMAT:-}

      # ----- Genre normalization -----
      # Collapses the genres downloads arrive with into a browsable list. Off by
      # default. The mapping table itself lives in the dashboard / settings.json,
      # because encoding structured rows in .env is brittle.
      Genre__Enabled: ${GENRE_NORMALIZE:-false}
      Genre__MaxGenres: ${GENRE_MAX:-10}
      Genre__OnEmpty: ${GENRE_ON_EMPTY:-Clear}
      Genre__Fallback: ${GENRE_FALLBACK:-None}
      Genre__UnknownLabel: ${GENRE_UNKNOWN_LABEL:-Unknown}
      Genre__BackfillMaxConsecutiveFailures: ${GENRE_BACKFILL_MAX_FAILURES:-25}

      # ----- Library actions (fix a wrong download from any client) -----
      # Off by default: these actions remove files Octo did not create. The action
      # names, the star mapping and who may trigger them live in the dashboard.
      LibraryActions__Enabled: ${LIBRARY_ACTIONS_ENABLED:-false}
      LibraryActions__PlaylistsEnabled: ${LIBRARY_ACTIONS_PLAYLISTS:-true}
      LibraryActions__RatingsEnabled: ${LIBRARY_ACTIONS_RATINGS:-false}
      LibraryActions__DryRun: ${LIBRARY_ACTIONS_DRY_RUN:-true}
      LibraryActions__QuarantineDirectory: ${LIBRARY_ACTIONS_TRASH_DIR:-.octo-trash}
      LibraryActions__QuarantineRetentionDays: ${LIBRARY_ACTIONS_TRASH_DAYS:-30}
      LibraryActions__PollIntervalSeconds: ${LIBRARY_ACTIONS_POLL_SECONDS:-60}
      LibraryActions__MaxActionsPerCycle: ${LIBRARY_ACTIONS_MAX_PER_CYCLE:-20}
      LibraryActions__KeepReplacedOriginals: ${LIBRARY_ACTIONS_KEEP_REPLACED:-true}
      LibraryActions__PlaylistPrefix: ${LIBRARY_ACTIONS_PREFIX:-🛠 }
      # Octo's own questions: a Review playlist it fills with downloads AcoustID could not
      # settle. Answer with Keep (5 stars) or an action; removing a track answers too.
      LibraryActions__NoticePrefix: ${LIBRARY_ACTIONS_NOTICE_PREFIX:-▸ }
      LibraryActions__ReviewEnabled: ${LIBRARY_ACTIONS_REVIEW:-false}
      # Recordings the library holds more than once, side by side, the copy worth keeping first.
      # Octo only points them out; nothing is removed unless you remove it.
      LibraryActions__DuplicatesEnabled: ${LIBRARY_ACTIONS_DUPLICATES:-false}
      LibraryActions__DuplicatesScanHours: ${LIBRARY_ACTIONS_DUPLICATES_SCAN_HOURS:-24}
      LibraryActions__NoticeMaxTracks: ${LIBRARY_ACTIONS_NOTICE_MAX:-100}
      # Auto: stars only act on tracks in Octo's playlists while Review or Duplicates is on.
      LibraryActions__RatingsScope: ${LIBRARY_ACTIONS_RATINGS_SCOPE:-Auto}

      # ----- Metadata language (genre tags etc. from Deezer / Last.fm) -----
      Metadata__Language: ${METADATA_LANGUAGE:-en}
      # A download with no album anywhere is filed as a single under its title, instead
      # of joining Navidrome's one [Unknown Album]. Never applied to a compilation.
      Metadata__AlbumFromTitle: ${ALBUM_FROM_TITLE:-true}
      # Cover art: the Cover Art Archive for a fingerprinted release, then the catalog,
      # Deezer, iTunes and Last.fm. A non-square cover is a video frame and counts as
      # missing. cover.jpg goes beside a download only in a folder it created (Organized).
      Metadata__UseCoverArtArchive: ${COVER_ART_ARCHIVE:-true}
      Metadata__ReplaceVideoCovers: ${REPLACE_VIDEO_COVERS:-true}
      Metadata__WriteCoverFile: ${COVER_FILE:-true}
      # Lyrics: a .lrc (synced) or .txt (plain) beside each download, and live lyrics
      # for songs as they play. kugou and netease are unofficial APIs; netease only
      # runs if listed, and leaving kugou out switches it off.
      Metadata__FetchLyrics: ${LYRICS_FETCH:-false}
      Metadata__LyricsSources: ${LYRICS_SOURCES:-kugou,lrclib,lyricsovh}
      Metadata__PreferWordTimedLyrics: ${LYRICS_PREFER_WORD_TIMED:-true}
      Metadata__WriteLyricsBesideAllSongs: ${LYRICS_WRITE_BESIDE_ALL:-false}

      # ----- Notifications (ntfy / Discord webhook) — both optional -----
      Notifications__NtfyUrl: ${NTFY_URL:-}
      Notifications__NtfyToken: ${NTFY_TOKEN:-}
      Notifications__DiscordWebhookUrl: ${DISCORD_WEBHOOK_URL:-}
      Notifications__NotifyDownloadStarted: ${NOTIFY_DOWNLOAD_STARTED:-false}
      Notifications__NotifyDownloadCompleted: ${NOTIFY_DOWNLOAD_COMPLETED:-true}
      Notifications__NotifyLosslessFallback: ${NOTIFY_LOSSLESS_FALLBACK:-true}
      Notifications__NotifyDownloadFailed: ${NOTIFY_DOWNLOAD_FAILED:-true}
      Notifications__NotifyAlbumCompleted: ${NOTIFY_ALBUM_COMPLETED:-true}
    volumes:
      - ${DOWNLOAD_PATH:-./downloads}:/music
      # Editable settings file — admin UI writes here, ASP.NET hot-reloads on
      # change. Bind-mounted to host so values survive `docker compose up`.
      - ./octo-config:/app/config
      - ${DEEZER_CACHE_HOST_PATH:-./octo-cache/deezer}:/app/cache/deezer
    depends_on:
      - slskd

  # Soulseek client (slskd). Web UI on 5030, peer port 50300.
  # State (config, db, downloads-in-progress) persisted to ./slskd-state so the
  # account survives recreate. SLSKD_DOWNLOADS_DIR below sends finished files
  # to the same /music mount Octo watches.
  slskd:
    image: slskd/slskd:latest
    container_name: slskd
    restart: unless-stopped
    ports:
      - "5030:5030"
      - "50300:50300"
    environment:
      SLSKD_REMOTE_CONFIGURATION: "true"
      # Completed downloads go to the shared /music mount so Octo can see and
      # relocate them. Without this slskd defaults to <app>/downloads, which the
      # slskd-state mount turns into ./slskd-state/downloads, a directory Octo
      # does not mount (issue #17). Incomplete transfers stay at the default
      # /app/incomplete (inside slskd-state) so partial files never enter the
      # library Navidrome scans.
      # NOTE: an explicit directories.downloads in ./slskd-state/slskd.yml
      # outranks this env var (slskd precedence: env < yaml).
      SLSKD_DOWNLOADS_DIR: /music
      SLSKD_SLSK_USERNAME: ${SLSKD_SOULSEEK_USERNAME:-}
      SLSKD_SLSK_PASSWORD: ${SLSKD_SOULSEEK_PASSWORD:-}
      SLSKD_USERNAME: ${SLSKD_USERNAME:-slskd}
      SLSKD_PASSWORD: ${SLSKD_PASSWORD:-slskd}
    volumes:
      - ./slskd-state:/app
      - ${DOWNLOAD_PATH:-./downloads}:/music
